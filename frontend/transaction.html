<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SecureBanking — Tạo và quản lý giao dịch">
    <title>SecureBanking — Giao dịch</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar-custom">
        <div style="max-width: 1400px; margin: 0 auto; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between;">
            <a href="transaction.html" class="navbar-brand-custom" style="text-decoration: none;">
                🏦 SecureBanking
            </a>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <div class="user-info">
                    <div class="user-avatar" id="navUserAvatar">U</div>
                    <span id="navUserName">User</span>
                </div>
                <button class="btn-logout" id="btnLogout">Đăng xuất</button>
            </div>
        </div>
    </nav>

    <div class="content-wrapper">
        <div class="page-header">
            <h1>💳 Giao dịch</h1>
            <p class="subtitle">Tạo giao dịch mới và xem lịch sử giao dịch của bạn</p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="glass-card animate-in">
                <h3>📝 Tạo giao dịch mới</h3>

                <div id="formAlert" class="alert-custom"></div>

                <form id="transactionForm">
                    <div class="form-grid">
                        <div class="form-group-custom">
                            <label for="transactionType">Loại giao dịch *</label>
                            <select id="transactionType" class="form-control-custom" required>
                                <option value="">-- Chọn loại --</option>
                                <option value="INTERNAL">Nội bộ (Internal Transfer)</option>
                                <option value="INTERBANK">Liên ngân hàng (Interbank Transfer)</option>
                            </select>
                        </div>

                        <div class="form-group-custom">
                            <label for="senderAccount">Tài khoản gửi *</label>
                            <input type="text" id="senderAccount" class="form-control-custom"
                                   placeholder="VD: VCB-1001-2024" required>
                        </div>

                        <div class="form-group-custom">
                            <label for="amount">Số tiền (VNĐ) *</label>
                            <input type="number" id="amount" class="form-control-custom"
                                   placeholder="Nhập số tiền" min="1" step="1000" required>
                        </div>

                        <div class="form-group-custom" id="receiverAccountGroup">
                            <label for="receiverAccount">Tài khoản nhận *</label>
                            <input type="text" id="receiverAccount" class="form-control-custom"
                                   placeholder="VD: VCB-1002-2024">
                        </div>

                        <div class="form-group-custom hidden" id="receiverBankGroup">
                            <label for="receiverBank">Ngân hàng nhận *</label>
                            <input type="text" id="receiverBank" class="form-control-custom"
                                   placeholder="VD: Vietcombank">
                        </div>

                        <div class="form-group-custom hidden" id="swiftCodeGroup">
                            <label for="swiftCode">SWIFT Code *</label>
                            <input type="text" id="swiftCode" class="form-control-custom"
                                   placeholder="VD: BFTVVNVX">
                        </div>

                        <div class="form-group-custom hidden full-width" id="digitalSignatureGroup">
                            <label for="digitalSignature">🔐 Chữ ký số (Digital Signature) *</label>
                            <input type="text" id="digitalSignature" class="form-control-custom"
                                   placeholder="Chữ ký số bắt buộc cho giao dịch > 50,000,000 VNĐ">
                            <small style="color: var(--warning); font-size: 0.78rem; margin-top: 0.3rem; display: block;">
                                ⚠️ Giao dịch trên 50 triệu VNĐ yêu cầu chữ ký số
                            </small>
                        </div>

                        <div class="full-width" style="margin-top: 0.5rem;">
                            <button type="submit" id="btnSubmit" class="btn-primary-custom">
                                Tạo giao dịch
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="glass-card animate-in">
                <h3>📋 Lịch sử giao dịch</h3>

                <div class="table-wrapper">
                    <table class="table-custom">
                        <thead>
                            <tr>
                                <th>Mã GD</th>
                                <th>Loại</th>
                                <th>Số tiền</th>
                                <th>Trạng thái</th>
                                <th>Ngày tạo</th>
                            </tr>
                        </thead>
                        <tbody id="transactionTableBody">
                            <tr><td colspan="5" class="empty-state"><div class="icon">📭</div><p>Chưa có giao dịch</p></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/transaction.js"></script>
</body>
</html>
