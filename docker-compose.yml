services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: securebanking-database
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    env_file:
      - ./backend/.env
    networks:
      - sb-network
    volumes:
      - sqlserver_data:/var/opt/mssql

  backend:
    build: 
      context: ./backend
    container_name: securebanking-backend
    restart: unless-stopped
    depends_on:
      - database
    env_file:
      - ./backend/.env
    networks:
      - sb-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    container_name: securebanking-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sb-network

  nginx:
    image: nginx:alpine
    container_name: securebanking-nginx
    restart: unless-stopped
    ports:
      - "89:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sb-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/login.html"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  sb-network:
    driver: bridge

volumes:
  sqlserver_data:
