version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: securebanking-backend
    restart: unless-stopped
    ports:
      - "8099:8080"
    env_file:
      - ./backend/.env
    networks:
      - sb-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    container_name: securebanking-frontend
    restart: unless-stopped
    ports:
      - "89:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sb-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/login.html"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  sb-network:
    driver: bridge
